name: "S2"

on:
  workflow_dispatch:

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  # This is required for actions/checkout
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract GitHub OIDC Token
        run: |
          RAW_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hs-gh" | jq -r '.value')
          echo "=== COPY BASE64 STRING BELOW ==="
          echo "$RAW_TOKEN" | base64 -w 0
          echo -e "\n=============================="
          echo "=== JFrog Access Token ==="
          ACCESS_TOKEN=$(jf exchange-oidc-token mikeho-github $RAW_TOKEN | jq -r '.AccessToken')
          echo "$ACCESS_TOKEN"
          echo -e "\n=============================="
          echo "=== JFrog Token Permissions==="
          curl -H "Authorization: Bearer $ACCESS_TOKEN" "https://${{ vars.JF_URL }}/access/api/v1/tokens/me" | jq
          echo -e "\n=============================="

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          # JFrog platform url (for example: https://acme.jfrog.io)
          JF_URL: https://${{ vars.JF_URL }}/
        with:
          # Name of the OIDC provider as specified on the OIDC integration page in the JFrog Platform
          oidc-provider-name: hs-gh

      - name: Run JFrog CLI
        run: |
          # Ping the server
          jf docker pull hts2-hs-new-docker.jfrog.io/memcached:bookworm
          jf docker scan hts2-hs-new-docker.jfrog.io/memcached:bookworm
